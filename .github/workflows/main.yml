name: Auto Scrape & Paraphrase News

on:
  schedule:
    # Berjalan otomatis setiap 6 jam sekali
    - cron: '0 */6 * * *'
  workflow_dispatch: # Memungkinkan dijalankan manual lewat tab Actions

permissions:
  contents: write

# Mencegah dua workflow saling menabrak saat commit & push bersamaan
concurrency:
  group: repo-update-lock
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4

      - name: Run News Scraper
        run: |
          python import.py

      - name: Commit & Push Updated Files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add database.sqlite index.html page2.html sitemap.xml robots.txt feed.xml 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Auto update news, HTML, sitemap, and RSS"
            git pull --rebase -X ours --autostash origin main
            git push origin main
          else
            echo "Tidak ada file baru atau perubahan untuk di-push."
          fi
